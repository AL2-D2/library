<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>

<body>
    <button class="new-book-btn" popovertarget="new-book-dialog">Add New Book</button>


    <dialog popover id="new-book-dialog">
        <div class="form-container">
            <form action class="book-form">
                <div>
                    <label for="book-title">Book Name:</label>
                    <input type="text" name="book-title" id="book-title" required>
                </div>
                <div>
                    <label for="book-author">Author:</label>
                    <input type="text" name="book-author" id="book-author" required>
                </div>
                <div>
                    <label for="book-pages">Pages:</label>
                    <input type="number" name="book-pages" id="book-pages" required>
                </div>
                <div class="radio-group">
                    <input type="radio" id="status-read" name="book-status" value="read">
                    <label for="status-read">Read</label>
                    <input type="radio" id="status-unread" name="book-status" value="unread" checked>
                    <label for="status-unread">Unread</label>
                </div>
                <div class="form-actions">
                    <button id="add-book-btn" type="submit">Add Book</button>
                    <button id="clear-form-btn" type="button">Clear</button>
                    <button type="button" popovertarget="new-book-dialog" popovertargetaction="hide">Close</button>
                </div>
            </form>
        </div>
    </dialog>


    <div class="book-grid-container">
    </div>
    <script src="script.js" defer></script>
</body>

</html>
